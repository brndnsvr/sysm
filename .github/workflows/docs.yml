name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build Documentation
        run: |
          xcodebuild docbuild \
            -scheme SysmCore \
            -derivedDataPath /tmp/docbuild \
            -destination 'generic/platform=macOS'

      - name: Process Archive for GitHub Pages
        run: |
          # docbuild also produces archives for dependencies (ArgumentParser,
          # Yams), so select SysmCore's by name rather than whichever find
          # returns first.
          DOCC_ARCHIVE=$(find /tmp/docbuild -type d -name "SysmCore.doccarchive" | head -n 1)

          if [ -z "$DOCC_ARCHIVE" ]; then
            echo "Error: Could not find SysmCore.doccarchive"
            exit 1
          fi

          echo "Found archive: $DOCC_ARCHIVE"

          # Convert to static website
          xcrun docc process-archive \
            transform-for-static-hosting "$DOCC_ARCHIVE" \
            --output-path docs \
            --hosting-base-path sysm

          # Verify output
          ls -la docs/

          # Create .nojekyll to bypass Jekyll processing
          touch docs/.nojekyll

          # DocC's root index.html is the app shell without the /sysm/ base
          # path, so the site root renders blank. Redirect it to the module.
          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>sysm API documentation</title>
          <meta http-equiv="refresh" content="0; url=documentation/sysmcore/">
          <link rel="canonical" href="documentation/sysmcore/">
          </head>
          <body>
          <p><a href="documentation/sysmcore/">SysmCore API documentation</a></p>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

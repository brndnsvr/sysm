name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  XCODE_VERSION: '26.6'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Run SwiftLint
        run: swiftlint lint
        continue-on-error: true

      - name: Check SwiftFormat
        run: swiftformat --lint .
        continue-on-error: true

      # Not continue-on-error: a bundle that no longer matches its source, or
      # that names the wrong version, ships to every user through the release
      # asset and the Homebrew formula.
      - name: Validate bundled Claude skill
        run: ./scripts/validate-skill.sh

      - name: Test release-cycle versioning
        run: ./scripts/test-versioning.sh

  build-debug:
    name: Build (Debug)
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Generate version
        run: ./scripts/generate-version.sh

      - name: Build debug
        run: swift build -c debug

  build-release:
    name: Build (Release)
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Generate version
        run: ./scripts/generate-version.sh

      - name: Build release
        run: swift build -c release

      - name: Verify FoundationModels is linked
        run: |
          if ! otool -L .build/release/sysm | grep -q 'FoundationModels.framework'; then
            echo "Release binary does not link FoundationModels; sysm ai would be unavailable" >&2
            exit 1
          fi

  test:
    name: Test with Coverage
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Generate version
        run: ./scripts/generate-version.sh

      - name: Run tests
        run: swift test --enable-code-coverage --skip IntegrationTests --skip AppleScriptPerformanceTests --skip OutlookServiceTests
        timeout-minutes: 15

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export \
            .build/debug/sysmPackageTests.xctest/Contents/MacOS/sysmPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format="lcov" > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false

  docc:
    name: Validate DocC
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-spm-

      - name: Build DocC
        run: |
          swift package --allow-writing-to-directory ./docs/api \
            generate-documentation --target SysmCore \
            --output-path ./docs/api \
            --transform-for-static-hosting \
            --hosting-base-path sysm

  build-xcode-27:
    name: Build and Test (Xcode 27 preview)
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version
        run: ./scripts/generate-version.sh

      - name: Build debug
        run: swift build -c debug

      - name: Run tests
        run: swift test --skip IntegrationTests --skip AppleScriptPerformanceTests --skip OutlookServiceTests
        timeout-minutes: 15
